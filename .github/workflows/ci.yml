name: Stage 32 validation

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'
      - 'automation/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beauty_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d beauty_platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/beauty_platform?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prisma validate
        run: pnpm --filter @beauty-platform/api prisma:validate
      - name: Prisma generate
        run: pnpm --filter @beauty-platform/api prisma:generate
      - name: Apply migrations to disposable PostgreSQL
        run: pnpm --filter @beauty-platform/api exec prisma migrate deploy
      - name: Verify migration status
        run: pnpm --filter @beauty-platform/api exec prisma migrate status
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
