name: ORZELL application review
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orzell-application-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host
    timeout-minutes: 15
    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_API_URL: https://preview.13-51-112-228.sslip.io/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.28.1
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @beauty-platform/types build
      - name: Check photo source formatting
        run: |
          files="apps/mobile/VisualJourney.tsx apps/mobile/App.tsx apps/mobile/photo-upload.ts apps/mobile/native-photo.ts apps/mobile/native-photo-expo.ts apps/mobile/src/native-photo.test.ts scripts/check-photo-picker-web.cjs scripts/check-consultation-recovery.cjs scripts/check-matching-availability.cjs apps/api/src/mvp/visual.service.ts apps/api/src/mvp/visual.controller.ts apps/api/src/mvp/visual-matches.service.ts apps/api/src/mvp/semantic.service.ts apps/api/src/mvp/photo-maintenance.service.ts apps/api/integration/providers.test.ts apps/api/integration/mvp.e2e.test.ts packages/types/src/mvp-visual.ts apps/api/src/mvp/visual.dto.ts scripts/check-matching-refresh.cjs .github/workflows/orzell-application.yml"
          if ! pnpm exec prettier --check $files; then
            pnpm exec prettier --write $files
            git diff --no-ext-diff -- $files
            exit 1
          fi
      - run: pnpm --filter @beauty-platform/mobile typecheck
      - run: pnpm exec vitest run apps/mobile/src packages/types/src/mvp-client.test.ts
      - run: pnpm --filter @beauty-platform/mobile exec expo export --platform web --output-dir dist --max-workers 2
      - name: Verify package matches the preinstalled browser image
        run: node -e "if (require('@playwright/test/package.json').version !== '1.64.1') throw new Error('Review the pinned browser image before upgrading Playwright')"
      - name: Exercise isolated customer and business screens
        run: node scripts/check-orzell-application.cjs apps/mobile/dist /tmp/orzell-application-review
      - name: Review service icons, prices and selection at three widths
        run: node scripts/check-service-cards.cjs apps/mobile/dist /tmp/orzell-application-review
      - name: Exercise shared product import and inventory workflow
        run: node scripts/check-product-inventory.cjs apps/mobile/dist /tmp/orzell-application-review
      - name: Exercise shared appointment material consumption
        run: node scripts/check-appointment-materials.cjs apps/mobile/dist /tmp/orzell-application-review
      - name: Exercise shared supplier and business quote workflow
        run: node scripts/check-business-b2b.cjs apps/mobile/dist /tmp/orzell-application-review
      - name: Exercise photo picker in isolated Chromium and WebKit
        run: node scripts/check-photo-picker-web.cjs apps/mobile/dist /tmp/orzell-application-review
      - name: Check matching availability and preserve plans in Chromium and WebKit
        run: node scripts/check-matching-availability.cjs apps/mobile/dist /tmp/orzell-application-review
      - name: Restore saved consultations without repeating provider work
        run: node scripts/check-consultation-recovery.cjs apps/mobile/dist /tmp/orzell-application-review
      - name: Refresh a saved NO_MATCH without another photo analysis
        run: node scripts/check-matching-refresh.cjs apps/mobile/dist /tmp/orzell-application-review
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: orzell-application-screens
          path: /tmp/orzell-application-review
          retention-days: 7
          if-no-files-found: error
