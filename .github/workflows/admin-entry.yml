name: ORZELL admin entry review
on:
  pull_request:
    paths:
      - apps/admin/**
      - scripts/check-admin-entry.cjs
      - .github/workflows/admin-entry.yml
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: https://api.example.test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.28.1
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @beauty-platform/types build
      - run: pnpm --filter @beauty-platform/admin test
      - run: pnpm --filter @beauty-platform/admin lint
      - run: pnpm --filter @beauty-platform/admin exec next build --webpack
      - run: pnpm --filter @beauty-platform/admin typecheck
      - name: Use HTTPS for existing official Ubuntu mirrors
        run: |
          python3 -m unittest discover -s scripts -p test_ci_ubuntu_https.py -v
          sudo python3 scripts/ci-ubuntu-https.py
      - run: pnpm exec playwright install chromium webkit --with-deps
      - run: node scripts/check-admin-entry.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: orzell-admin-entry-review
          path: /tmp/orzell-admin-entry
          retention-days: 7
          if-no-files-found: ignore
