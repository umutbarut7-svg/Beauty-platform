name: Preview catalog binding safety

on:
  pull_request:
    paths:
      - infra/operations/publish-preview-catalog-bindings.sh
      - infra/operations/test_catalog_bindings.py
      - infra/operations/queue-preview-catalog-bindings.sh
      - infra/operations/catalog-bindings-request.json
      - .github/workflows/preview-catalog-bindings.yml
      - .github/operations/preview-commands.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Check shell syntax and offline failure recovery
        run: |
          bash -n infra/operations/publish-preview-catalog-bindings.sh
          python3 -m unittest discover -s infra/operations -p test_catalog_bindings.py -v
