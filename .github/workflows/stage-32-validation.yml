name: Stage 32 validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage-32-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Prisma and regression gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/beauty_platform_ci?schema=public
      EXPO_PUBLIC_API_URL: http://localhost:3001

    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-trixie
        env:
          POSTGRES_DB: beauty_platform_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d beauty_platform_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Prisma schema formatting
        run: |
          pnpm --filter @beauty-platform/api exec prisma format
          git diff --exit-code -- apps/api/prisma/schema.prisma

      - name: Validate Prisma schema
        run: pnpm --filter @beauty-platform/api prisma:validate

      - name: Generate Prisma client
        run: pnpm --filter @beauty-platform/api prisma:generate

      - name: Apply migrations to ephemeral database
        run: pnpm --filter @beauty-platform/api prisma:migrate

      - name: Verify migration status
        run: pnpm --filter @beauty-platform/api exec prisma migrate status

      - name: Verify representative-data migration upgrade
        run: apps/api/prisma/verify-stage32-upgrade.sh

      - name: Build shared types
        run: pnpm --filter @beauty-platform/types build

      - name: Run governance tests
        run: pnpm --filter @beauty-platform/api exec vitest run src/governance

      - name: Run API tests
        run: pnpm --filter @beauty-platform/api test

      - name: Run governance PostgreSQL integration tests
        env:
          STAGE32_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/beauty_platform_ci?schema=public
        run: pnpm --filter @beauty-platform/api test:integration

      - name: Type-check API
        run: pnpm --filter @beauty-platform/api typecheck

      - name: Lint API
        run: pnpm --filter @beauty-platform/api lint

      - name: Build API
        run: pnpm --filter @beauty-platform/api build

      - name: Build workspace
        run: pnpm build

      - name: Export Android and iOS JavaScript and Hermes bundles
        run: pnpm --filter @beauty-platform/mobile exec expo export --platform all --output-dir /tmp/stage33-platform-bundles --max-workers 2

      - name: Run workspace tests
        run: pnpm test

      - name: Check formatting
        run: pnpm format:check

      - name: Type-check workspace
        run: pnpm typecheck

      - name: Lint workspace
        run: pnpm lint

      - name: Check whitespace errors
        run: git diff --check

      - name: Install Chromium for Stage 33 web E2E
        run: pnpm exec playwright install chromium --with-deps

      - name: Start isolated S3-compatible storage for adapter tests
        run: |
          docker run --detach --name stage33-private-storage -p 127.0.0.1:9000:9000 -e MINIO_ROOT_USER=stage33-test-root -e MINIO_ROOT_PASSWORD=stage33-isolated-test-password -e MINIO_KMS_SECRET_KEY=ci-key:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= cgr.dev/chainguard/minio@sha256:32c504bea4574d8f29d719b37bc0dad920ecf3e22b81dc5cea0bb105af2ce10f server /data
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready > /dev/null; then exit 0; fi
            sleep 1
          done
          docker logs stage33-private-storage
          exit 1

      - name: Stage 33 real HTTP, Expo web, Next.js and passport worker
        env:
          STAGE32_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/beauty_platform_ci?schema=public
          STAGE33_TEST_REDIS_URL: redis://127.0.0.1:6379
          STAGE33_TEST_S3_ENDPOINT: http://127.0.0.1:9000
        run: pnpm --filter @beauty-platform/api test:stage33:integration

      - name: Preserve Stage 33 browser diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage33-browser-diagnostics
          path: /tmp/stage33-*.png
          if-no-files-found: ignore
          retention-days: 3
