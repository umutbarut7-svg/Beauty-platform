name: Owner small recovery safety
on:
  pull_request:
    paths:
      - infra/operations/start-small-recovery.py
      - infra/operations/test_start_small_recovery.py
      - .github/workflows/small-recovery-safety.yml
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify owner create boundaries without AWS or production material
        run: python3 -m unittest discover -s infra/operations -p test_start_small_recovery.py -v
      - name: Verify offline default and compile
        run: |
          python3 -m py_compile infra/operations/start-small-recovery.py
          python3 infra/operations/start-small-recovery.py
