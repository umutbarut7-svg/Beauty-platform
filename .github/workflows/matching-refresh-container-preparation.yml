name: Same-plan matching refresh release rehearsal
on:
  pull_request:
    paths:
      - .github/workflows/matching-refresh-container-preparation.yml
      - infra/operations/rehearse-matching-refresh-release.sh
      - infra/operations/verify-matching-refresh-image.cjs
      - docs/stage-33/matching-refresh-deployment-20261104.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout release harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: harness
          persist-credentials: false
      - name: Checkout exact reviewed application
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f712d06427092211d11c28d862365283d79f26e1
          path: application
          persist-credentials: false
      - name: Build API and migration images and rehearse in an isolated database
        run: bash harness/infra/operations/rehearse-matching-refresh-release.sh
      - name: Preserve only release images, checksums and synthetic evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: matching-refresh-release-${{ github.run_id }}
          path: release/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
