name: Inspect backup storage configuration
on:
  pull_request:
    paths:
      - infra/operations/inspect-backup-storage.py
      - infra/operations/test_backup_storage_inspection.py
      - .github/operations/backup-storage-inspection.json
      - .github/workflows/inspect-backup-storage.yml
  push:
    branches: [main]
    paths: [.github/operations/backup-storage-inspection.json]
permissions: {}
jobs:
  offline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s infra/operations -p test_backup_storage_inspection.py -v
  inspect:
    if: github.repository == 'umutbarut7-svg/Beauty-platform' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: arn:aws:iam::926642724499:role/BeautyPlatformGitHubAudit
          aws-region: eu-north-1
          role-session-name: backup-storage-inspection-${{ github.run_id }}
          role-duration-seconds: 900
          mask-aws-account-id: true
          output-credentials: false
          disable-retry: true
      - name: Read configuration with existing audit identity
        run: python3 infra/operations/inspect-backup-storage.py
