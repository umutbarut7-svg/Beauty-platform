name: Visual service compatibility release rehearsal
on:
  pull_request:
    paths:
      - .github/workflows/visual-service-container-preparation.yml
      - infra/operations/rehearse-visual-service-release.sh
      - infra/operations/verify-visual-service-image.cjs
      - docs/stage-33/visual-service-deployment-20261031.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout release harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: harness
          persist-credentials: false
      - name: Checkout exact reviewed application
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 04009b390d014431fe0d4fd99c965e2ce134fa20
          path: application
          persist-credentials: false
      - name: Build API and migration images and rehearse in an isolated database
        run: bash harness/infra/operations/rehearse-visual-service-release.sh
      - name: Preserve only release images, checksums and synthetic evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visual-service-release-${{ github.run_id }}
          path: release/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
