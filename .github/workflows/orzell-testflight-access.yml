name: ORZELL resend owner TestFlight invitation
on:
  push:
    branches: [codex/orzell-testflight-access]
    paths: [.github/workflows/orzell-testflight-access.yml]
permissions: {}
concurrency:
  group: orzell-testflight-access-1011
  cancel-in-progress: false
jobs:
  enable:
    if: github.ref == 'refs/heads/codex/orzell-testflight-access'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify exact owner tester and resend authorized Apple invitation
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        shell: bash
        run: |
          node <<'NODE'
          const crypto=require("node:crypto");
          const fs=require("node:fs");
          async function main(){
            const key=crypto.createPrivateKey(process.env.ASC_PRIVATE_KEY.trim());
            if(key.asymmetricKeyType!=="ec" || key.asymmetricKeyDetails?.namedCurve!=="prime256v1") throw new Error("Invalid Apple API key.");
            const enc=o=>Buffer.from(JSON.stringify(o)).toString("base64url");
            async function api(method,path,body){
              const now=Math.floor(Date.now()/1000);
              const input=enc({alg:"ES256",kid:process.env.ASC_KEY_ID.trim(),typ:"JWT"})+"."+enc({iss:process.env.ASC_ISSUER_ID.trim(),iat:now-5,exp:now+120,aud:"appstoreconnect-v1"});
              const token=input+"."+crypto.sign("sha256",Buffer.from(input),{key,dsaEncoding:"ieee-p1363"}).toString("base64url");
              console.log("::add-mask::"+token);
              const r=await fetch("https://api.appstoreconnect.apple.com/v1/"+path,{method,headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined,redirect:"error",signal:AbortSignal.timeout(30000)});
              if(!r.ok) { const errors=await r.json().catch(()=>({})); throw new Error("Apple request HTTP "+r.status+": "+JSON.stringify(errors.errors?.map(e=>({code:e.code,title:e.title,detail:e.detail})))); }
              return r.status===204?null:r.json();
            }
            const apps=await api("GET","apps?filter[bundleId]=com.orzell.app&limit=2");
            if(apps.data.length!==1 || apps.data[0].attributes.bundleId!=="com.orzell.app") throw new Error("Unexpected app.");
            const app=apps.data[0].id;
            const groups=await api("GET","betaGroups?filter[app]="+encodeURIComponent(app)+"&limit=50");
            const group=groups.data.find(g=>g.id==="cd903680-b6ba-402f-9272-716a7ca4cf32" && g.attributes.isInternalGroup && g.attributes.name==="ORZELL iç test");
            if(!group) throw new Error("Existing internal group was not verified.");
            const testers=await api("GET","betaGroups/"+encodeURIComponent(group.id)+"/betaTesters?limit=200");
            const expectedEmailHash="24e3553f268296e4c84852f613353f61e35986d8b259b6408de77e37f54ee505";
            const matches=testers.data.filter(t=>crypto.createHash("sha256").update((t.attributes.email??"").trim().toLowerCase()).digest("hex")===expectedEmailHash);
            if(matches.length!==1) throw new Error("The owner's exact existing tester email could not be uniquely verified. No invitation sent.");
            const tester=matches[0];
            console.log("Exact owner email matched an existing tester in the confirmed internal group.");
            console.log("Tester state before invitation: "+tester.attributes.state);
            const builds=await api("GET","betaGroups/"+encodeURIComponent(group.id)+"/builds?limit=200");
            if(!builds.data.some(b=>b.attributes.version==="1011" && b.attributes.processingState==="VALID")) throw new Error("Expected processed build is unavailable to the group.");
            const invitation=await api("POST","betaTesterInvitations",{data:{type:"betaTesterInvitations",relationships:{app:{data:{type:"apps",id:app}},betaTester:{data:{type:"betaTesters",id:tester.id}}}}});
            if(invitation?.data?.type!=="betaTesterInvitations") throw new Error("Invitation creation was not confirmed.");
            console.log("Apple accepted the TestFlight invitation resend for the verified owner tester.");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,"TestFlight invitation resend accepted by Apple for the uniquely verified existing owner tester. No additional recipient or tester was created.\n");
          }
          main().catch(e=>{console.error("::error::"+e.message);process.exitCode=1;});
          
          NODE
