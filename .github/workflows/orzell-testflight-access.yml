name: ORZELL verify existing internal TestFlight build access
on:
  push:
    branches: [codex/orzell-testflight-access]
    paths: [.github/workflows/orzell-testflight-access.yml]
permissions: {}
concurrency:
  group: orzell-testflight-access-1191
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/codex/orzell-testflight-access'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Inspect build 1191 and its existing internal group
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        shell: bash
        run: |
          node <<'NODE'
          const crypto=require("node:crypto");
          const fs=require("node:fs");
          async function main(){
            const key=crypto.createPrivateKey(process.env.ASC_PRIVATE_KEY.trim());
            if(key.asymmetricKeyType!=="ec" || key.asymmetricKeyDetails?.namedCurve!=="prime256v1") throw new Error("Invalid Apple API key.");
            const enc=o=>Buffer.from(JSON.stringify(o)).toString("base64url");
            async function api(path){
              const now=Math.floor(Date.now()/1000);
              const input=enc({alg:"ES256",kid:process.env.ASC_KEY_ID.trim(),typ:"JWT"})+"."+enc({iss:process.env.ASC_ISSUER_ID.trim(),iat:now-5,exp:now+120,aud:"appstoreconnect-v1"});
              const token=input+"."+crypto.sign("sha256",Buffer.from(input),{key,dsaEncoding:"ieee-p1363"}).toString("base64url");
              console.log("::add-mask::"+token);
              const r=await fetch("https://api.appstoreconnect.apple.com/v1/"+path,{method:"GET",headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"},redirect:"error",signal:AbortSignal.timeout(30000)});
              if(!r.ok) { const errors=await r.json().catch(()=>({})); throw new Error( "Apple GET "+path.split("?")[0]+" returned HTTP "+r.status+": "+JSON.stringify(errors.errors?.map(e=>({code:e.code,title:e.title,detail:e.detail})))); }
              return r.status===204?null:r.json();
            }
            const apps=await api("apps?filter[bundleId]=com.orzell.app&limit=2");
            if(apps.data.length!==1 || apps.data[0].attributes.bundleId!=="com.orzell.app") throw new Error("Unexpected app record.");
            const app=apps.data[0].id;
            const groups=await api("betaGroups?filter[app]="+encodeURIComponent(app)+"&limit=50");
            const group=groups.data.find(g=>g.id==="cd903680-b6ba-402f-9272-716a7ca4cf32" && g.attributes.name==="ORZELL iç test" && g.attributes.isInternalGroup===true);
            if(!group) throw new Error("Expected existing owner internal test group.");
            const result=await api("builds?filter[app]="+encodeURIComponent(app)+"&filter[version]=1191&include=preReleaseVersion,buildBetaDetail&limit=5");
            if(result.data.length!==1) throw new Error("Expected one matching build. Found "+result.data.length);
            const build=result.data[0];
            const version=result.included?.find(i=>i.type==="preReleaseVersions" && i.id===build.relationships.preReleaseVersion.data.id);
            if(version?.attributes.version!=="1.0.0" || version?.attributes.platform!=="IOS") throw new Error("Unexpected prerelease identity.");
            const detail=await api("builds/"+encodeURIComponent(build.id)+"/buildBetaDetail");
            const membership=await api("betaGroups/"+encodeURIComponent(group.id)+"/builds?limit=200");
            const report={
              build:build.attributes.version,
              processing:build.attributes.processingState,
              expired:build.attributes.expired,
              encryptionDeclaration:build.attributes.usesNonExemptEncryption,
              internalTesting:detail.data.attributes.internalBuildState,
              allBuilds:group.attributes.hasAccessToAllBuilds,
              listedInInternalGroup:membership.data.some(item=>item.id===build.id) ? true : (membership.links?.next ? null : false)
            };
            console.log(JSON.stringify(report));
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,"## ORZELL internal TestFlight 1191\n\n"+JSON.stringify(report)+"\n");
          }
          main().catch(e=>{console.error("::error::"+e.message);process.exitCode=1;});
          NODE
