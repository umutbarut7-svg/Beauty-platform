name: ORZELL verify existing internal TestFlight build access
on:
  push:
    branches: [codex/orzell-testflight-access]
    paths: [.github/workflows/orzell-testflight-access.yml]
permissions: {}
concurrency:
  group: orzell-testflight-access-1051
  cancel-in-progress: false
jobs:
  enable:
    if: github.ref == 'refs/heads/codex/orzell-testflight-access'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Confirm processed build and existing internal group access
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        shell: bash
        run: |
          node <<'NODE'
          const crypto=require("node:crypto");
          const fs=require("node:fs");
          async function main(){
            const key=crypto.createPrivateKey(process.env.ASC_PRIVATE_KEY.trim());
            if(key.asymmetricKeyType!=="ec" || key.asymmetricKeyDetails?.namedCurve!=="prime256v1") throw new Error("Invalid Apple API key.");
            const enc=o=>Buffer.from(JSON.stringify(o)).toString("base64url");
            async function api(method,path,body){
              const now=Math.floor(Date.now()/1000);
              const input=enc({alg:"ES256",kid:process.env.ASC_KEY_ID.trim(),typ:"JWT"})+"."+enc({iss:process.env.ASC_ISSUER_ID.trim(),iat:now-5,exp:now+120,aud:"appstoreconnect-v1"});
              const token=input+"."+crypto.sign("sha256",Buffer.from(input),{key,dsaEncoding:"ieee-p1363"}).toString("base64url");
              console.log("::add-mask::"+token);
              const r=await fetch("https://api.appstoreconnect.apple.com/v1/"+path,{method,headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined,redirect:"error",signal:AbortSignal.timeout(30000)});
              if(!r.ok) { const errors=await r.json().catch(()=>({})); throw new Error("Apple "+method+" "+path.split("?")[0]+" returned HTTP "+r.status+": "+JSON.stringify(errors.errors?.map(e=>({code:e.code,title:e.title,detail:e.detail})))); }
              return r.status===204?null:r.json();
            }
            const apps=await api("GET","apps?filter[bundleId]=com.orzell.app&limit=2");
            if(apps.data.length!==1 || apps.data[0].attributes.bundleId!=="com.orzell.app") throw new Error("Unexpected app record.");
            const app=apps.data[0].id;
            const groups=await api("GET","betaGroups?filter[app]="+encodeURIComponent(app)+"&limit=50");
            const group=groups.data.find(g=>g.id==="cd903680-b6ba-402f-9272-716a7ca4cf32" && g.attributes.name==="ORZELL iç test" && g.attributes.isInternalGroup===true);
            if(!group) throw new Error("Expected existing owner internal test group.");
            let build;
            for(let attempt=1;attempt<=24;attempt++){
              const result=await api("GET","builds?filter[app]="+encodeURIComponent(app)+"&filter[version]=1051&include=preReleaseVersion,buildBetaDetail&limit=5");
              if(result.data.length>1) throw new Error("Ambiguous build number.");
              build=result.data[0];
              if(build){
                const version=result.included?.find(i=>i.type==="preReleaseVersions" && i.id===build.relationships.preReleaseVersion.data.id);
                if(version?.attributes.version!=="1.0.0" || version?.attributes.platform!=="IOS") throw new Error("Unexpected prerelease version.");
                console.log("Build 1.0.0 (1051): "+build.attributes.processingState);
                if(build.attributes.processingState==="VALID") break;
                if(["FAILED","INVALID"].includes(build.attributes.processingState)) throw new Error("Apple processing rejected the build.");
              }else console.log("Waiting for Apple build processing ("+attempt+"/24).");
              if(attempt===24) throw new Error("Apple processing is still pending; no group changes performed.");
              await new Promise(r=>setTimeout(r,20000));
            }
            if(build.attributes.expired || build.attributes.usesNonExemptEncryption===true) throw new Error("Build requires separate review before enabling tests.");
            // Release merge 8ffc92c4d0c3478e3591ea11d24f4da9ec7e24fe; reviewed candidate fcf741dc079faf4c790947d11b4e7452c53a47fd.
            // Relative to reviewed build 1041, only native file-header IO and File multipart serialization change.
            // The exact package versions, lockfile and reviewed encryption inventory are unchanged.
            // No global fetch/Blob replacement or new cryptography implementation is introduced.
            // Existing Apple operating-system-only encryption exemption:
            // https://developer.apple.com/help/app-store-connect/reference/app-information/export-compliance-documentation-for-encryption
            if(build.attributes.usesNonExemptEncryption==null){
              await api("PATCH","builds/"+encodeURIComponent(build.id),{data:{type:"builds",id:build.id,attributes:{usesNonExemptEncryption:false}}});
              console.log("Platform HTTPS-only encryption exemption recorded for reviewed build 1051.");
            }
            const before=await api("GET","builds/"+encodeURIComponent(build.id)+"/buildBetaDetail");
            console.log("Internal state before group assignment: "+before.data.attributes.internalBuildState);
            console.log("Internal group access-to-all-builds: "+group.attributes.hasAccessToAllBuilds);
            let associated=false;
            for(let attempt=1;attempt<=24;attempt++){
              const confirmed=await api("GET","betaGroups/"+encodeURIComponent(group.id)+"/builds?limit=200");
              if(confirmed.data.some(b=>b.id===build.id)){associated=true;break;}
              console.log("Waiting for existing internal-group distribution ("+attempt+"/24).");
              if(group.attributes.hasAccessToAllBuilds!==true) throw new Error("Existing internal group requires manual build assignment in App Store Connect; unsupported API writes are not retried.");
              await new Promise(r=>setTimeout(r,10000));
            }
            if(!associated) throw new Error("Processed build is not yet listed for the existing internal group; no group or tester was changed.");
            const detail=await api("GET","builds/"+encodeURIComponent(build.id)+"/buildBetaDetail");
            const state=detail.data.attributes.internalBuildState;
            console.log("Internal testing state: "+state);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,"## ORZELL internal TestFlight\n\nApple processed ORZELL 1.0.0 (1051) successfully. Reviewed platform HTTPS-only encryption exemption recorded if needed. Build association with existing ORZELL iç test group verified. Internal testing state: "+state+". No external testing, App Review or public release requested.\n");
            if(!["IN_BETA_TESTING","READY_FOR_BETA_TESTING"].includes(state)) throw new Error("Group association exists, but internal testing is not yet ready: "+state);
            console.log("ORZELL 1.0.0 (1051) is available to the existing internal test group.");
          }
          main().catch(e=>{console.error("::error::"+e.message);process.exitCode=1;});
          
          NODE
