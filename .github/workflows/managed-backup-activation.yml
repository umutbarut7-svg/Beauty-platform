name: Activate first verified backup after approved cloud retention
on:
  push:
    branches: [main]
    paths: [.github/operations/managed-backup-activation.json]
permissions: {}
concurrency:
  group: preview-server-operations
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'umutbarut7-svg/Beauty-platform' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    outputs:
      ready: ${{ steps.audit.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: arn:aws:iam::926642724499:role/BeautyPlatformGitHubAudit
          aws-region: eu-north-1
          role-session-name: managed-backup-audit-${{ github.run_id }}
          role-duration-seconds: 900
          mask-aws-account-id: true
          output-credentials: false
          disable-retry: true
      - id: audit
        name: Require actual approved lifecycle, metric policy and alarm configuration
        run: python3 infra/operations/audit-managed-backup.py
  activate:
    needs: audit
    if: github.ref == 'refs/heads/main' && needs.audit.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: arn:aws:iam::926642724499:role/BeautyPlatformPreviewOperations
          aws-region: eu-north-1
          role-session-name: managed-backup-activate-${{ github.run_id }}
          role-duration-seconds: 1800
          mask-aws-account-id: true
          output-credentials: false
          disable-retry: true
      - name: First verified database backup, then daily and hourly timers
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess, time
          def aws(*args):
              p = subprocess.run(['aws', *args, '--region', 'eu-north-1', '--output', 'json', '--no-cli-pager', '--cli-connect-timeout', '5', '--cli-read-timeout', '20'], capture_output=True, text=True, timeout=35)
              if p.returncode:
                  raise SystemExit('AWS operation unavailable: ' + ' '.join(args[:2]))
              return json.loads(p.stdout)
          identity = aws('sts', 'get-caller-identity')
          if identity.get('Account') != '926642724499' or not identity.get('Arn', '').startswith('arn:aws:sts::926642724499:assumed-role/BeautyPlatformPreviewOperations/'):
              raise SystemExit('Unexpected operation identity')
          request = json.loads(pathlib.Path('.github/operations/managed-backup-activation.json').read_text())
          if set(request) != {'request_id', 'mode', 'release', 'signer'} or request['request_id'] != 'orzell-managed-backup-activation-20261106-1' or request['mode'] != 'first-backup-and-enable-timers' or not re.fullmatch('[0-9a-f]{40}', request['release']) or not re.fullmatch('[0-9a-f]{64}', request['signer']):
              raise SystemExit('Unsupported bound activation')
          helper = pathlib.Path('infra/operations/install-managed-backup.py').read_text()
          script = 'import types\nINSTALLER = types.ModuleType("backup_install_helpers")\nexec(' + repr(helper) + ', INSTALLER.__dict__)\nACTIVATION_REQUEST = ' + repr(request) + '\n' + pathlib.Path('infra/operations/activate-managed-backup.py').read_text()
          if len(script.encode()) > 24000:
              raise SystemExit('Activation payload exceeds bound')
          response = aws('ssm', 'send-command', '--instance-ids', 'i-09fe7fdb5f10d63b6', '--document-name', 'AWS-RunShellScript', '--parameters', json.dumps({'commands': ['python3 - <<\'ORZELL_MANAGED_ACTIVATE\'\n' + script + '\nORZELL_MANAGED_ACTIVATE'], 'executionTimeout': ['1000']}), '--comment', 'Reviewed first backup and timer activation ' + os.environ['GITHUB_RUN_ID'])
          command_id = response['Command']['CommandId']
          print('SSM command:', command_id, flush=True)
          for _ in range(195):
              time.sleep(5)
              result = aws('ssm', 'get-command-invocation', '--command-id', command_id, '--instance-id', 'i-09fe7fdb5f10d63b6')
              if result['Status'] not in ['Pending', 'InProgress', 'Delayed']:
                  break
          else:
              raise SystemExit('Activation uncertain; inspect recorded command and backup receipts before any retry')
          print('SSM status:', result['Status'])
          try:
              report = json.loads(result.get('StandardOutputContent', ''))
          except ValueError:
              report = {'status': 'OUTPUT_UNAVAILABLE'}
          if result['Status'] != 'Success':
              reason = report.get('reason', '')
              print(json.dumps({'status': 'ACTIVATION_FAILED', 'reason': reason if re.fullmatch(r'[A-Za-z0-9_:.-]{1,160}', reason) else 'INSPECTION_REQUIRED'}))
              raise SystemExit('Activation failed; no blind retry')
          if report.get('status') != 'MANAGED_BACKUP_ACTIVE' or report.get('timersEnabled') is not True or report.get('firstBackupHealthy') is not True or report.get('applicationServicesUnchanged') is not True:
              raise SystemExit('Activation evidence differs')
          print(json.dumps(report, sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Managed backup activation\n\nCommand: `' + command_id + '`\n\n```json\n' + json.dumps(report, indent=2, sort_keys=True) + '\n```\n')
          PY
