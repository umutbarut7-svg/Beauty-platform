name: Stage 33 live journey acceptance

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: stage33-live-journey
  cancel-in-progress: false

jobs:
  adapters:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/beauty_platform_live_ci?schema=public
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-trixie
        env:
          POSTGRES_DB: beauty_platform_live_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d beauty_platform_live_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out trusted test harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false

      - name: Check out reviewed application revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Explicit reviewed Stage 33 head; never accept an arbitrary ref input.
          ref: 123e7339e2ab2a9e8e94f391a8431b73afc28efe
          path: application
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.28.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: application/pnpm-lock.yaml

      - name: Build reviewed application and migrate disposable database
        working-directory: application
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @beauty-platform/api prisma:generate
          pnpm --filter @beauty-platform/types build
          pnpm --filter @beauty-platform/api build
          pnpm --filter @beauty-platform/api prisma:migrate
          cp "$GITHUB_WORKSPACE/harness/scripts/stage33-live-journey.cjs" apps/api/stage33-live-journey.cjs
          cp "$GITHUB_WORKSPACE/harness/scripts/stage33-live-fixture-preload.cjs" apps/api/stage33-live-fixture-preload.cjs

      - name: Assume narrowly scoped synthetic-test role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: arn:aws:iam::926642724499:role/BeautyPlatformLiveAdapterTest
          aws-region: eu-north-1
          role-session-name: stage33-journey-${{ github.run_id }}
          role-duration-seconds: 900
          mask-aws-account-id: true
          allowed-account-ids: 926642724499

      - name: Run live HTTP catalog and privacy worker journey
        working-directory: application/apps/api
        env:
          STAGE33_LIVE_JOURNEY_TEST: confirmed
          NODE_ENV: production
          MVP_S3_ENABLED: "true"
          MVP_S3_BUCKET: beautyplatform-private-photos-dev
          MVP_AI_ENABLED: "true"
          OPENAI_VISION_MODEL: gpt-5.4-mini
          OPENAI_EMBEDDING_MODEL: text-embedding-3-small
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          try:
              result = subprocess.run([
                  "aws", "ssm", "get-parameter",
                  "--name", "/beauty-platform/dev/openai-api-key",
                  "--with-decryption", "--region", "eu-north-1",
                  "--output", "json", "--no-cli-pager",
                  "--cli-connect-timeout", "5", "--cli-read-timeout", "20"
              ], capture_output=True, text=True, timeout=35)
              if result.returncode:
                  raise RuntimeError()
              parameter = json.loads(result.stdout)["Parameter"]
              if parameter["Type"] != "SecureString":
                  raise RuntimeError()
              secret = parameter["Value"].strip()
              if not secret or any(c.isspace() for c in secret):
                  raise RuntimeError()
          except Exception:
              print("FAIL: encrypted parameter binding")
              sys.exit(1)
          child_env = {**os.environ, "OPENAI_API_KEY": secret}
          code = subprocess.run(["node", "stage33-live-journey.cjs"], env=child_env).returncode
          sys.exit(code)
          PY
