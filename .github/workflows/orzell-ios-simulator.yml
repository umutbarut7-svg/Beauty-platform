name: ORZELL iOS simulator launch

on:
  pull_request:
    paths:
      - .github/workflows/orzell-ios-simulator.yml
      - scripts/check-orzell-ios-simulator.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: orzell-ios-simulator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  launch:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out simulator acceptance harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download fixed reviewed artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location --connect-timeout 15 --max-time 120 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            https://api.github.com/repos/umutbarut7-svg/Beauty-platform/actions/artifacts/12551818470/zip \
            --output "$RUNNER_TEMP/orzell-ios-reviewed.zip"
      - name: Verify artifact, install and cold-launch twice
        run: |
          python3 scripts/check-orzell-ios-simulator.py "$RUNNER_TEMP/orzell-ios-reviewed.zip" "$RUNNER_TEMP/orzell-simulator-review"
      - name: Upload only synthetic launch evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ORZELL-ios-simulator-launch
          path: |
            ${{ runner.temp }}/orzell-simulator-review/ios-launch-*.png
            ${{ runner.temp }}/orzell-simulator-review/simulator-evidence.json
          if-no-files-found: warn
          retention-days: 7
