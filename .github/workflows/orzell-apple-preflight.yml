name: ORZELL Apple read-only preflight
on:
  push:
    branches: [codex/orzell-apple-preflight]
    paths: [.github/workflows/orzell-apple-preflight.yml]
  workflow_dispatch:
permissions: {}
concurrency:
  group: orzell-apple-preflight
  cancel-in-progress: false
jobs:
  check:
    if: github.ref == 'refs/heads/codex/orzell-apple-preflight'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Authenticate and inspect Apple resources without mutations
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        shell: bash
        run: |
          node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          async function main() {
            for (const name of ["ASC_KEY_ID", "ASC_ISSUER_ID", "ASC_PRIVATE_KEY"]) {
              if (!process.env[name]?.trim()) throw new Error("Missing secret: " + name);
            }
            let key;
            try { key = crypto.createPrivateKey(process.env.ASC_PRIVATE_KEY.trim()); }
            catch { throw new Error("ASC_PRIVATE_KEY is not a valid PEM private key; paste the complete .p8 text, including BEGIN/END lines."); }
            if (key.asymmetricKeyType !== "ec" || key.asymmetricKeyDetails?.namedCurve !== "prime256v1")
              throw new Error("ASC_PRIVATE_KEY must be an Apple P-256 key.");
            const encode = value => Buffer.from(JSON.stringify(value)).toString("base64url");
            const now = Math.floor(Date.now() / 1000);
            const unsigned = encode({alg:"ES256",kid:process.env.ASC_KEY_ID.trim(),typ:"JWT"}) + "." +
              encode({iss:process.env.ASC_ISSUER_ID.trim(),iat:now-5,exp:now+300,aud:"appstoreconnect-v1"});
            const token = unsigned + "." + crypto.sign("sha256",Buffer.from(unsigned),{key,dsaEncoding:"ieee-p1363"}).toString("base64url");
            console.log("::add-mask::" + token);
            async function get(path) {
              let response;
              try { response = await fetch("https://api.appstoreconnect.apple.com/v1/" + path, {
                headers:{Authorization:"Bearer " + token}, redirect:"error",signal:AbortSignal.timeout(30000)
              }); } catch { throw new Error("Apple API network request failed."); }
              if (!response.ok) throw new Error("Apple API returned HTTP " + response.status + " for " + path.split("?")[0]);
              return response.json();
            }
            const apps = await get("apps?filter[bundleId]=com.orzell.app&limit=2");
            if (apps.data?.length !== 1 || apps.data[0].attributes.bundleId !== "com.orzell.app")
              throw new Error("Expected exactly one App Store Connect record for com.orzell.app.");
            const appId = apps.data[0].id;
            const builds = await get("builds?filter[app]=" + encodeURIComponent(appId) + "&include=buildBetaDetail&sort=-uploadedDate&limit=5");
            console.log("Build status: "+JSON.stringify(builds.data.map(b=>({id:b.id,version:b.attributes.version,state:b.attributes.processingState,usesNonExemptEncryption:b.attributes.usesNonExemptEncryption,detail:builds.included?.find(i=>i.type===\"buildBetaDetails\" && i.id===b.relationships.buildBetaDetail.data.id)?.attributes}))));
            const groups=await get("betaGroups?filter[app]="+encodeURIComponent(appId)+"&limit=20");
            console.log("Beta groups: "+JSON.stringify(groups.data.map(g=>({id:g.id,name:g.attributes.name,isInternalGroup:g.attributes.isInternalGroup}))));
            const bundle = await get("bundleIds?filter[identifier]=com.orzell.app&limit=2");
            if (bundle.data?.length !== 1) throw new Error("Confirmed bundle registration was not found.");
            const certificates = await get("certificates?filter[certificateType]=DISTRIBUTION,IOS_DISTRIBUTION&limit=200");
            const validCertificates = certificates.data.filter(c => Date.parse(c.attributes.expirationDate) > Date.now()).length;

            const expectedSpki = "4abe470c88f67bcee2eed6f9a0610251ec0f7fdfae8632749b50a9c3b5e24e6a";
            const hashCert = raw => {
              const cert = new crypto.X509Certificate(Buffer.from(raw,"base64"));
              if (!cert.subject.split("\n").includes("OU=CDL78S6U9A")) throw new Error("Certificate team mismatch.");
              return crypto.createHash("sha256").update(cert.publicKey.export({format:"der",type:"spki"})).digest("hex");
            };
            const matching = certificates.data.filter(c => Date.parse(c.attributes.expirationDate)>Date.now() && hashCert(c.attributes.certificateContent)===expectedSpki);
            if (matching.length !== 1) throw new Error("Exactly one valid distribution certificate must match the original CSR.");
            const profiles = await get("profiles?filter[name]=ORZELL%20App%20Store&include=bundleId,certificates&limit=20");
            const profile = profiles.data.filter(p => p.attributes.name==="ORZELL App Store" && p.attributes.profileType==="IOS_APP_STORE" && p.attributes.profileState==="ACTIVE" && Date.parse(p.attributes.expirationDate)>Date.now());
            if (profile.length!==1) throw new Error("Expected one active ORZELL App Store profile.");
            const p=profile[0];
            if (!p.relationships.certificates.data.some(c=>c.id===matching[0].id)) throw new Error("Profile does not contain the CSR-matched distribution certificate.");
            const b=profiles.included.find(i=>i.type==="bundleIds" && i.id===p.relationships.bundleId.data.id);
            if (b?.attributes.identifier!=="com.orzell.app") throw new Error("Profile bundle ID mismatch.");
            const cp=require("node:child_process");
            const cms=cp.spawnSync("openssl",["cms","-verify","-inform","DER","-noverify"],{input:Buffer.from(p.attributes.profileContent,"base64"),maxBuffer:4*1024*1024});
            if(cms.status!==0) throw new Error("Profile CMS signature verification failed.");
            const py=cp.spawnSync("python3",["-c",[
              "import sys,plistlib,datetime",
              "p=plistlib.loads(sys.stdin.buffer.read())",
              "assert p['Name']=='ORZELL App Store'",
              "assert p['TeamIdentifier']==['CDL78S6U9A']",
              "assert p['Entitlements']['application-identifier']=='CDL78S6U9A.com.orzell.app'",
              "assert p['Entitlements'].get('get-task-allow') is False",
              "assert not p.get('ProvisionedDevices') and not p.get('ProvisionsAllDevices')",
              "assert p['ExpirationDate']>datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None)",
              "print('App Store profile contents verified.')"
            ].join("\n")],{input:cms.stdout,maxBuffer:1024*1024});
            if(py.status!==0) throw new Error("Profile entitlements validation failed.");
            console.log("CSR public key, distribution certificate and active App Store profile match.");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,"\n- Original CSR public key matches the valid distribution certificate.\n- Active ORZELL App Store profile matches certificate, bundle ID and team.\n- Profile CMS signature and App Store entitlements verified (Apple chain trust is checked during Xcode signing).\n");

            const summary = [
              "## ORZELL Apple read-only preflight",
              "",
              "- Private key parsed and authenticated successfully.",
              "- App record and bundle registration: com.orzell.app.",
              "- At least one uploaded build: " + (builds.data.length > 0 ? "yes" : "no") + ".",
              "- Unexpired distribution certificates visible: " + validCertificates + ".",
              "- A certificate listing does not prove that its private signing key is available to CI.",
              "- No certificate/profile creation, upload, tester invitation or store submission performed."
            ].join("\n") + "\n";
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
            console.log("Unexpired distribution certificates visible: " + validCertificates);
            console.log("Uploaded build visible: " + (builds.data.length > 0));
            console.log("ORZELL Apple authentication and read-only resource checks passed.");
          }
          main().catch(error => { console.error("::error::" + error.message); process.exitCode = 1; });
          NODE
