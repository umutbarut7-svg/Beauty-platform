// Resolve these pinned Foojay artifacts at their publisher before general repositories.
gradle.beforeSettings { settings ->
    def directory = settings.settingsDir
    if (directory.name != 'gradle-plugin' || directory.parentFile.name != '@react-native') {
        return
    }
    // Use the same module as the published Kotlin marker POM.
    settings.pluginManagement.resolutionStrategy.eachPlugin {
        if (requested.id.id == 'org.jetbrains.kotlin.jvm' && requested.version == '2.1.20') {
            useModule('org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.20')
        }
    }
    settings.pluginManagement.repositories.gradlePluginPortal {
        name = 'orzellFoojayPluginPortal'
        content {
            includeVersion('org.gradle.toolchains.foojay-resolver-convention',
                'org.gradle.toolchains.foojay-resolver-convention.gradle.plugin', '1.0.0')
            includeVersion('org.gradle.toolchains', 'foojay-resolver', '1.0.0')
        }
    }
}
